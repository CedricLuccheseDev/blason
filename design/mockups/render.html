<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800;900&family=Cinzel:wght@600;700;900&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap"
    />
    <style>
      body {
        margin: 0;
        width: 1440px;
        height: 900px;
        overflow: hidden;
        background: #efe3c4;
        position: relative;
      }
      .l {
        position: absolute;
        inset: 0;
        width: 1440px;
        height: 900px;
      }
    </style>
  </head>
  <body>
    <div id="map" class="l"></div>
    <svg class="l" style="mix-blend-mode: multiply" viewBox="0 0 1440 900">
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.8"
          numOctaves="3"
          seed="5"
        />
        <feColorMatrix
          values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.18  0.42 0 0 0 -0.12"
        />
      </filter>
      <filter id="stain" x="0" y="0" width="100%" height="100%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.0045"
          numOctaves="4"
          seed="11"
        />
        <feColorMatrix
          values="0 0 0 0 0.62  0 0 0 0 0.45  0 0 0 0 0.22  1.3 0 0 0 -0.62"
        />
      </filter>
      <rect width="1440" height="900" filter="url(#grain)" />
      <rect width="1440" height="900" filter="url(#stain)" opacity="0.55" />
      <radialGradient id="vig" cx="50%" cy="50%" r="75%">
        <stop offset="0.62" stop-color="#fff" stop-opacity="0" />
        <stop offset="1" stop-color="#9c7436" stop-opacity="0.55" />
      </radialGradient>
      <rect id="vigr" width="1440" height="900" fill="url(#vig)" />
    </svg>
    <script>
      const q = new URLSearchParams(location.search)
      fetch((q.get('d') || 'cells') + '/' + q.get('f') + '.svg')
        .then((r) => r.text())
        .then((t) => {
          document.getElementById('map').innerHTML = t
          if (q.get('vig') === '0') document.getElementById('vigr').remove()
          return document.fonts.ready
        })
        .then(() => {
          document.body.dataset.ready = '1'
        })
    </script>
  </body>
</html>
