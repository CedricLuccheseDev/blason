<title>Maquette de Blason</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Vollkorn:ital,wght@0,400;0,600;1,400&family=Vollkorn+SC:wght@400;600&family=IM+Fell+English+SC&display=swap">
<style>
/* The maquette's page: the game's parchment and ink (src/styles/app.css),
   its two hands, Vollkorn for the words and Alegreya Sans for the figures;
   the frames side by side, as tall as each other, filling the column. */
:root {
  color-scheme: light;
  --vellum: #f6eedb;
  --quill: #2b1e12;
  --lead: #5e5749;
  --shade: #d9c49a;
  --gilt-deep: #946512;
  --fell: 'Vollkorn', Georgia, serif;
  --figures: 'Alegreya Sans', 'Trebuchet MS', sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--vellum);
  color: var(--quill);
  font-family: var(--fell);
}
header,
main {
  max-width: 1440px;
  margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
header {
  padding-top: 40px;
  padding-bottom: 8px;
}
h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 400;
}
h2 {
  margin: 0;
  font-size: 26px;
  font-weight: 400;
}
h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 400;
  font-style: italic;
}
header p,
.line {
  margin: 4px 0 0;
  max-width: 70ch;
  color: var(--lead);
  font-size: 17px;
  font-style: italic;
}
.moment {
  padding: 32px 0;
  border-top: 1px solid var(--shade);
}
header + main .moment:first-child {
  border-top: 0;
}
.version {
  margin-top: 20px;
}
.row {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  align-items: flex-start;
}
/* Each frame takes the row's width in the share of its own width to its
   height: all of a row come out as tall. */
.frame {
  flex: var(--aspect) 1 0;
  min-width: 0;
  margin: 0;
  cursor: zoom-in;
}
.screen {
  position: relative;
  aspect-ratio: var(--w) / var(--h);
  overflow: hidden;
  outline: 1px solid var(--shade);
  background: var(--shade);
}
.screen iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: calc(var(--w) * 1px);
  height: calc(var(--h) * 1px);
  border: 0;
  transform: scale(var(--k, 0.25));
  transform-origin: 0 0;
  pointer-events: none;
}
figcaption {
  margin-top: 6px;
  color: var(--lead);
  font-family: var(--figures);
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
/* A phone reads the frames one under the other, the upright ones narrower. */
@media (max-width: 720px) {
  header,
  main {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header {
    padding-top: 24px;
  }
  .row {
    flex-direction: column;
  }
  .frame {
    width: 100%;
    flex: none;
  }
  .frame.upright {
    width: 70%;
  }
}
dialog {
  width: 96vw;
  max-width: none;
  height: 96vh;
  max-height: none;
  padding: 12px;
  border: 1px solid var(--shade);
  background: var(--vellum);
}
dialog::backdrop {
  background: rgb(43 30 18 / 0.6);
}
.large {
  position: relative;
  height: calc(100% - 28px);
  overflow: hidden;
}
.large iframe {
  position: absolute;
  border: 0;
  transform-origin: 0 0;
}
.large-name {
  margin: 4px 0 0;
  color: var(--lead);
  font-family: var(--figures);
  font-size: 14px;
  font-weight: 500;
}

</style>
<header>
  <h1>Blason, la maquette</h1>
  <p>Chaque cadre est le jeu lui-même : la carte et le HUD d'une vraie partie, figée à un moment, à chaque taille d'écran. Un clic l'ouvre en grand.</p>
</header>
<main id="moments"></main>
<dialog id="large"><div class="large"></div><p class="large-name"></p></dialog>

<script>
// A frame of the maquette as a document of its own, built in the browser
// from a capture (capture.mjs): the game's page round its HUD, the map's
// image in the map's place, the game's CSS and fonts, so that the HUD lays
// out as the game laid it at that size; a proposal's pieces, if one is
// given, in the place of the game's. The maquette's page (page.js) and the
// boards (board.js) both build their frames so.

/** The frames stand still: each motion of the HUD held where it reads, a pennant shown, a seal at its glow. */
const STILL = `
*, *::before, *::after { transition: none !important; }
.hud-enter, .rise-in, .fade-in { animation: none !important; }
.hud-life { animation-delay: -2s !important; animation-play-state: paused !important; }
.hud-glow { animation-delay: -0.7s !important; animation-play-state: paused !important; }
.hud-bob { animation-play-state: paused !important; }
`

const quote = (text) =>
  text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')
const attributes = (all) =>
  Object.entries(all)
    .map(([name, value]) => ` ${name}="${quote(value)}"`)
    .join('')

/** A frame's document: `frame` a capture ({ hud, map }), `page` the document round the HUD and `css` the game's, as captured; `extra` more of the head. */
function frameDocument(frame, { page, css, proposal, extra = '' }) {
  const doc = new DOMParser().parseFromString(frame.hud, 'text/html')
  for (const [selector, markup] of Object.entries(proposal?.replace ?? {}))
    for (const piece of doc.body.querySelectorAll(selector))
      piece.outerHTML = markup
  // The map's place, marked so by the capture (the game's map, or the game
  // playing behind the home); the first captures knew only the game's.
  const map =
    doc.body.querySelector('[data-map]') ??
    doc.body.querySelector('main > [role="img"]')
  if (map && frame.map) {
    const image = doc.createElement('img')
    image.setAttribute('src', frame.map)
    image.setAttribute('alt', '')
    image.setAttribute('style', 'display:block;width:100%;height:100%')
    map.replaceChildren(image)
  }
  const fonts = page.fonts
    .map((href) => `<link rel="stylesheet" href="${quote(href)}">`)
    .join('')
  const own = proposal?.css ? `<style>${proposal.css}</style>` : ''
  return `<!doctype html><html${attributes(page.html)}><head><meta charset="utf-8">${fonts}<style>${css}</style><style>${STILL}</style>${own}${extra}</head><body${attributes(page.body)}>${doc.body.innerHTML}</body></html>`
}

// The maquette's page (build.mjs inlines it after frame.js): each frame a
// document of its own (frameDocument), built from the captures held once in
// the page, at its real size, so that the game's CSS lays the HUD out as the
// game does at that size; then scaled down to its place in the row. A frame
// is built as it comes near the screen; a click opens it large.

const data = JSON.parse(document.getElementById('data').textContent)

const near = new IntersectionObserver(
  (entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue
      const frame = entry.target
      frame.querySelector('iframe').srcdoc = frame.build()
      near.unobserve(frame)
    }
  },
  { rootMargin: '600px 0px' },
)

/** Each screen's iframe scaled to the screen's width, as the page's width changes. */
const fit = new ResizeObserver((entries) => {
  for (const entry of entries) {
    const screen = entry.target
    const width = Number(screen.dataset.width)
    screen.style.setProperty('--k', String(screen.clientWidth / width))
  }
})

const large = document.getElementById('large')

/** A frame opened large, as large as the window allows. */
function open(doc, width, height, name) {
  const room = large.querySelector('.large')
  large.querySelector('.large-name').textContent = name
  large.showModal()
  const k = Math.min(room.clientWidth / width, room.clientHeight / height)
  const iframe = document.createElement('iframe')
  iframe.width = String(width)
  iframe.height = String(height)
  iframe.style.transform = `scale(${k})`
  iframe.style.left = `${(room.clientWidth - width * k) / 2}px`
  iframe.srcdoc = doc
  room.replaceChildren(iframe)
}
large.addEventListener('click', (e) => {
  if (e.target === large) large.close()
})

function frameElement(frame, proposal, name) {
  const { width, height } = frame
  const figure = document.createElement('figure')
  figure.className = width < height ? 'frame upright' : 'frame'
  figure.style.setProperty('--aspect', String(width / height))
  const screen = document.createElement('div')
  screen.className = 'screen'
  screen.dataset.width = String(width)
  screen.style.setProperty('--w', String(width))
  screen.style.setProperty('--h', String(height))
  const iframe = document.createElement('iframe')
  iframe.setAttribute('loading', 'lazy')
  iframe.setAttribute('tabindex', '-1')
  iframe.title = `${name}, ${width} × ${height}`
  screen.append(iframe)
  const caption = document.createElement('figcaption')
  caption.textContent = `${width} × ${height}`
  figure.append(screen, caption)
  figure.build = () =>
    frameDocument(frame, { page: data.page, css: data.css, proposal })
  figure.addEventListener('click', () =>
    open(figure.build(), width, height, iframe.title),
  )
  near.observe(figure)
  fit.observe(screen)
  return figure
}

function version(moment, title, line, proposal) {
  const block = document.createElement('div')
  block.className = 'version'
  if (title) {
    const heading = document.createElement('h3')
    heading.textContent = title
    block.append(heading)
  }
  if (line) {
    const words = document.createElement('p')
    words.className = 'line'
    words.textContent = line
    block.append(words)
  }
  const row = document.createElement('div')
  row.className = 'row'
  for (const frame of moment.frames)
    row.append(frameElement(frame, proposal, moment.title))
  block.append(row)
  return block
}

const shown = (proposal, moment) =>
  !proposal.moments || proposal.moments.includes(moment.name)

for (const moment of data.moments) {
  const section = document.createElement('section')
  section.className = 'moment'
  section.id = moment.name
  const heading = document.createElement('h2')
  heading.textContent = moment.title
  const line = document.createElement('p')
  line.className = 'line'
  line.textContent = moment.line
  section.append(heading, line)
  const proposals = data.proposals.filter((p) => shown(p, moment))
  section.append(
    version(moment, proposals.length > 0 ? 'Le jeu' : null, null, null),
  )
  for (const proposal of proposals)
    section.append(
      version(
        moment,
        `Proposition : ${proposal.title}`,
        proposal.line,
        proposal,
      ),
    )
  document.getElementById('moments').append(section)
}

</script>
